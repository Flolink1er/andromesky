<h2 class="text-2xl font-bold text-center">Configuration du quiz</h2>

<div class="space-y-4">
  <div>
    <label class="font-semibold block mb-2"> Mode </label>

    <select
      [formControl]="modeControl"
      class="w-full rounded-lg bg-space-dark border border-white/10 p-2"
    >
      <option [ngValue]="QuizMode.GuessObject">Deviner l'objet</option>

      <option [ngValue]="QuizMode.LocateObject">Localiser l'objet</option>
    </select>
  </div>

  <div>
    <label class="font-semibold block mb-2"> Difficulté </label>

    <select
      [formControl]="difficultyControl"
      class="w-full rounded-lg bg-space-dark border border-white/10 p-2"
    >
      <option [ngValue]="QuizDifficulty.Easy">Facile</option>

      <option [ngValue]="QuizDifficulty.Medium">Moyen</option>

      <option [ngValue]="QuizDifficulty.Hard">Difficile</option>
    </select>
  </div>

  <div>
    <label class="font-semibold block mb-2"> Nombre de questions </label>

    <select
      [formControl]="questionCountControl"
      class="w-full rounded-lg bg-space-dark border border-white/10 p-2"
    >
      <option [ngValue]="5">5</option>
      <option [ngValue]="10">10</option>
      <option [ngValue]="15">15</option>
      <option [ngValue]="20">20</option>
    </select>
  </div>
</div>

<button class="button-green mt-6 w-full" (click)="startQuiz()">Commencer</button>
