<div class="rounded-xl border border-white/10 bg-slate-900 p-4 sm:p-6">

  <h2 class="mb-6 text-2xl font-bold">
    🎉 Quiz terminé !
  </h2>

  <div class="space-y-3">

    <p>
      ⭐ Score :
      <strong>{{ score() }} pts</strong>
    </p>

    <p>
      ✅ Bonnes réponses :
      <strong>{{ correctAnswers() }} / {{ totalQuestions() }}</strong>
    </p>

    <p>
      📈 Réussite :
      <strong>{{ successRate() }} %</strong>
    </p>

    <p>
      ⚡ Réponses éclair :
      <strong>{{ fastAnswers() }}</strong>
    </p>

    <p>{{resultMessage()}}</p>

  </div>

  <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-around">

    <button (click)="restartQuiz.emit()" class="button-green w-full sm:w-auto">
      Rejouer
    </button>

    <button (click)="backToExploration.emit()" class="button-green w-full sm:w-auto">
      Retour
    </button>

  </div>

</div>
