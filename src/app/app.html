<div class="min-h-screen flex flex-col">

  <app-header (changeMode)="changeMode($event)" />

  <!-- Contenaire principal -->
  <main class="flex flex-1 overflow-hidden">

    <!-- Panel de sélection (gauche) -->
    <app-side-panel [currentObject]="currentObject" [currentIndex]="currentIndex" (action)="handleAction($event)"
      (answer)="answerQuestion($event)" />

    <!-- Contenaire de la SkyMap -->
    <section class="flex-1 relative">
      <app-sky-map />
    </section>

  </main>

</div>
