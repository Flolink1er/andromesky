<div class="min-h-screen flex flex-col">
  <app-header (changeMode)="changeMode($event)">
    @if (!appStateService.isQuiz()) {
      <app-search-bar (objectSelected)="onObjectSelected($event)" />
    }
  </app-header>

  <!-- Contenaire principal -->
  <main class="flex flex-1 overflow-hidden">
    <!-- Panel de sélection (gauche) -->
    <app-side-panel
      [currentObject]="currentObject()"
      [currentIndex]="currentIndex"
      (action)="handleAction($event)"
      (switchMode)="changeMode($event)"
    />

    <!-- Contenaire de la SkyMap -->
    <section class="flex-1 relative">
      <app-sky-map (objectClicked)="onSkyClick($event.ra, $event.dec)" />
    </section>
  </main>
</div>
